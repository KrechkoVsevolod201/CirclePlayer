Summary: Offline music player with a Click Wheel and spinning vinyl
Description: |-
  Play audio files stored on your Android device with a classic wheel-based
  interface.
  .
  Features:
  * Browse local music and folders with a Click Wheel.
  * Optional haptic feedback and configurable wheel sound.
  * Spinning vinyl with album artwork and a screensaver.
  * Realtime analog-style audio effects.
  * Light/dark themes and a HSV color picker.
  * Android media session and notification controls.
  .
  No account, ads, analytics, or developer-side network service is included.
